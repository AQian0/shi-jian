name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    uses: ./.github/workflows/check.yml

  test:
    uses: ./.github/workflows/test.yml
    with:
      coverage: true

  build:
    uses: ./.github/workflows/build.yml
    with:
      check-size: true
      check-package: true
