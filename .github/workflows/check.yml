name: Check

on:
  workflow_call:
    inputs:
      bun-version:
        description: "Bun version to use"
        required: false
        type: string
        default: "latest"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bunx oxfmt --check

      - name: Type check
        run: bun run check
