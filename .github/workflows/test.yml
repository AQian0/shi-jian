name: Test

on:
  workflow_call:
    inputs:
      bun-version:
        description: "Bun version to use"
        required: false
        type: string
        default: "latest"
      coverage:
        description: "Run with coverage"
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run ${{ inputs.coverage && 'coverage' || 'test' }}
