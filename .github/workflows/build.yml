name: Build

on:
  workflow_call:
    inputs:
      bun-version:
        description: "Bun version to use"
        required: false
        type: string
        default: "latest"
      check-size:
        description: "Check bundle size"
        required: false
        type: boolean
        default: false
      check-package:
        description: "Run publint check"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check bundle size
        if: ${{ inputs.check-size }}
        run: bun run size

      - name: Check package
        if: ${{ inputs.check-package }}
        run: bun run publint
